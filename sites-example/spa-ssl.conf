# Generated for NGINX Open Source 1.30.5. Profile: spa. Target: host.
# Test it before you reload: nginx -t -c /etc/nginx/nginx.conf
# This file is standalone. It does not include the repository snippets.

# Workers run as an unprivileged user.
user nginx;
# One worker per CPU core. The NGINX default is a single worker.
worker_processes auto;
pid /run/nginx.pid;
# Every connection needs a file descriptor, and a proxied request needs two.
worker_rlimit_nofile 8192;
# Log warnings and worse. The NGINX default is error.
error_log /var/log/nginx/error.log warn;

events {
    # The NGINX default is 512. Raise the open-files limit together with this value.
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    # Unknown file types download instead of showing as text.
    default_type application/octet-stream;

    # Do not reveal the NGINX version.
    server_tokens off;
    # Redirects without a host name, so published ports and proxies cannot leak an internal port.
    absolute_redirect off;
    # Keep the security headers from the server block when a location adds its own header.
    add_header_inherit merge;

    # Send files from the kernel. tcp_nopush fills packets and needs sendfile.
    sendfile on;
    tcp_nopush on;
    # Drop slow header senders after 15 seconds (the default is 60) and free their sockets at once.
    client_header_timeout 15s;
    reset_timedout_connection on;

    # The log has no query string or Referer, because they can contain secrets. rid is the request ID.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
        '$status $body_bytes_sent "$http_user_agent" '
        'rt=$request_time urt=$upstream_response_time us=$upstream_status rid=$request_id';
    access_log /var/log/nginx/access.log main;

    # Intermediate (Mozilla guideline v6.0). The protocols match the NGINX default; they are listed so the policy is visible.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # Reuse TLS sessions across workers and keep them for a day. Ticket keys rotate on their own.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Compress text. Images and fonts such as woff2 are already compressed and are left out.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
        text/markdown text/csv text/vtt application/javascript
        application/json application/ld+json application/manifest+json application/vnd.geo+json
        application/xml application/xhtml+xml application/rss+xml application/atom+xml
        application/wasm image/svg+xml image/x-icon image/bmp
        font/ttf font/otf;
    # Serve file.ext.gz when it exists next to file.ext.
    gzip_static on;
    # Vary tells caches that the body depends on Accept-Encoding. "any" also compresses for CDNs, which send Via.
    gzip_vary on;
    gzip_proxied any;

    # Catch-all. Requests for an unknown Host get no answer.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;
    }

    # Reject TLS handshakes for unknown names before any certificate is chosen.
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name example.com;

        # Answer HTTP-01 challenges here, before the redirect. Let’s Encrypt only follows redirects to ports 80 and 443.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/_letsencrypt;
            try_files $uri =404;
        }

        location / {
            return 308 https://example.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name example.com;

        ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

        root /var/www/example.com/public;
        # Declare UTF-8 for text responses.
        charset utf-8;

        # The NGINX default is 1m. Larger uploads get status 413.
        client_max_body_size 1m;

        # Security headers are set once here. add_header_inherit merge lets locations add theirs.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

        # Health check for containers and load balancers. It is not logged and not rate limited.
        location = /healthz {
            access_log off;
            return 204;
        }

        # Dotfiles are private, except .well-known (security.txt, ACME, and similar).
        location ~ /\.(?!well-known/) {
            deny all;
        }

        # Backups and config files that deployments often leave behind.
        location ~* \.(?:bak|conf|dist|env|fla|inc|ini|log|psd|sh|sql|sw[op]|ya?ml)(?:~)?$ {
            deny all;
        }

        # HTML points at hashed files, so browsers must re-check it.
        location ~* \.html$ {
            add_header Cache-Control "no-cache" always;
        }

        # Plain prefix, so the dotfile and extension rules above still win. A missing file is a 404, never the app fallback.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
