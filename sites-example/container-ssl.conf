# Generated for NGINX Open Source 1.30.5. Profile: proxy. Target: container.
# Test it before you reload: nginx -t -c /etc/nginx/nginx.conf
# This file is standalone. It does not include the repository snippets.

# One worker per CPU core. The NGINX default is a single worker.
worker_processes auto;
pid /tmp/nginx.pid;
# Log warnings and worse. The NGINX default is error.
error_log /dev/stderr warn;

events {
    # The NGINX default is 512. Raise the open-files limit together with this value.
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # Unknown file types download instead of showing as text.
    default_type application/octet-stream;

    # Do not reveal the NGINX version.
    server_tokens off;
    # Redirects without a host name, so published ports and proxies cannot leak an internal port.
    absolute_redirect off;
    # Keep the security headers from the server block when a location adds its own header.
    add_header_inherit merge;

    # Send files from the kernel. tcp_nopush fills packets and needs sendfile.
    sendfile on;
    tcp_nopush on;
    # Drop slow header senders after 15 seconds (the default is 60) and free their sockets at once.
    client_header_timeout 15s;
    reset_timedout_connection on;

    # A non-root user can write only under /tmp.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # The log has no query string or Referer, because they can contain secrets. rid is the request ID.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
        '$status $body_bytes_sent "$http_user_agent" '
        'rt=$request_time urt=$upstream_response_time us=$upstream_status rid=$request_id';
    access_log /dev/stdout main;

    # The public port that visitors use, which can differ from the listen port.
    map $scheme $forwarded_port {
        default 80;
        https 443;
    }

    # Intermediate (Mozilla guideline v6.0). The protocols match the NGINX default; they are listed so the policy is visible.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # Reuse TLS sessions across workers and keep them for a day. Ticket keys rotate on their own.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    upstream backend {
        # Re-resolve host names while NGINX runs. A resolved name needs a shared memory zone.
        zone backend 64k;
        # The group needs its own resolver: it re-checks names every 30 seconds and gives up on a silent name server after 5 seconds (the default is 30).
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 5s;
        server app:3000 resolve;
    }

    # Catch-all. Requests for an unknown Host get no answer.
    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }

    # Reject TLS handshakes for unknown names before any certificate is chosen.
    server {
        listen 8443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    server {
        listen 8080;
        server_name example.com;

        # Answer certbot HTTP-01 challenges here, before any redirect or backend. Let’s Encrypt only follows redirects to ports 80 and 443.
        location ^~ /.well-known/acme-challenge/ {
            root /var/cache/nginx/acme-challenge;
            try_files $uri =404;
        }

        location / {
            return 308 https://example.com$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name example.com;

        ssl_certificate /etc/nginx/tls/example.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/example.com/privkey.pem;

        # The NGINX default is 1m. Larger uploads get status 413.
        client_max_body_size 1m;

        # Security headers are set once here. add_header_inherit merge lets locations add theirs.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

        # Health check for containers and load balancers. It is not logged and not rate limited.
        location = /healthz {
            access_log off;
            return 204;
        }

        # Dotfiles are private, except .well-known (security.txt, ACME, and similar).
        location ~ /\.(?!well-known/) {
            deny all;
        }

        location / {
            proxy_pass http://backend;
            # proxy_set_header is all or nothing per location, so each proxy location lists the full set.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # This NGINX is the trust boundary, so a client X-Forwarded-For is replaced, not extended.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_set_header X-Request-ID $request_id;
            # Empty values are not sent. This stops clients from faking proxy metadata.
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_set_header X-Url-Scheme "";
            proxy_set_header Front-End-Https "";
            proxy_set_header X-Client-IP "";
            proxy_set_header Client-IP "";
            proxy_set_header Proxy "";
            # Do not pass on what the backend says about its own stack.
            proxy_hide_header X-Powered-By;
            # Give up on an unreachable backend after 5 seconds (the default is 60).
            proxy_connect_timeout 5s;
        }
    }
}
