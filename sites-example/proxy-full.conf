# Generated for NGINX Open Source 1.30.5. Profile: proxy. Target: host.
# Test it before you reload: nginx -t -c /etc/nginx/nginx.conf
# This file is standalone. It does not include the repository snippets.

# The ACME module is a separate package. The official Docker image already has it.
load_module modules/ngx_http_acme_module.so;

# Workers run as an unprivileged user.
user nginx;
# One worker per CPU core. The NGINX default is a single worker.
worker_processes auto;
pid /run/nginx.pid;
# Every connection needs a file descriptor, and a proxied request needs two.
worker_rlimit_nofile 8192;
# Log warnings and worse. The NGINX default is error.
error_log /var/log/nginx/error.log warn;

events {
    # The NGINX default is 512. Raise the open-files limit together with this value.
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    # Unknown file types download instead of showing as text.
    default_type application/octet-stream;

    # Do not reveal the NGINX version.
    server_tokens off;
    # Redirects without a host name, so published ports and proxies cannot leak an internal port.
    absolute_redirect off;
    # Keep the security headers from the server block when a location adds its own header.
    add_header_inherit merge;

    # Send files from the kernel. tcp_nopush fills packets and needs sendfile.
    sendfile on;
    tcp_nopush on;
    # Drop slow header senders after 15 seconds (the default is 60) and free their sockets at once.
    client_header_timeout 15s;
    reset_timedout_connection on;

    # The log has no query string or Referer, because they can contain secrets. rid is the request ID.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
        '$status $body_bytes_sent "$http_user_agent" '
        'rt=$request_time urt=$upstream_response_time us=$upstream_status rid=$request_id';
    access_log /var/log/nginx/access.log main;

    # Cloudflare ranges, copied on 2026-10-01. Re-check them at https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Believe X-Forwarded-Proto only from a trusted proxy. Anything else falls back to the real scheme.
    geo $realip_remote_addr $from_trusted_proxy {
        default 0;
        173.245.48.0/20 1;
        103.21.244.0/22 1;
        103.22.200.0/22 1;
        103.31.4.0/22 1;
        141.101.64.0/18 1;
        108.162.192.0/18 1;
        190.93.240.0/20 1;
        188.114.96.0/20 1;
        197.234.240.0/22 1;
        198.41.128.0/17 1;
        162.158.0.0/15 1;
        104.16.0.0/13 1;
        104.24.0.0/14 1;
        172.64.0.0/13 1;
        131.0.72.0/22 1;
        2400:cb00::/32 1;
        2606:4700::/32 1;
        2803:f800::/32 1;
        2405:b500::/32 1;
        2405:8100::/32 1;
        2a06:98c0::/29 1;
        2c0f:f248::/32 1;
    }
    map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
        default $scheme;
        "1:https" https;
        "1:http" http;
    }
    # The public port that visitors use, which can differ from the listen port.
    map $forwarded_proto $forwarded_port {
        default 80;
        https 443;
    }

    # Intermediate (Mozilla guideline v6.0). The protocols match the NGINX default; they are listed so the policy is visible.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # Reuse TLS sessions across workers and keep them for a day. Ticket keys rotate on their own.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Ask clients to prove their address before QUIC starts. This blunts spoofed-address floods.
    quic_retry on;

    # Automatic certificates. state_path must be writable and survive restarts. Port 80 must be reachable for HTTP-01.
    acme_issuer letsencrypt {
        uri https://acme-v02.api.letsencrypt.org/directory;
        contact admin@example.com;
        state_path /var/cache/nginx/acme-letsencrypt;
        accept_terms_of_service;
    }
    acme_shared_zone zone=ngx_acme_shared:1M;

    # Name servers for the ACME module.
    resolver 127.0.0.53 valid=30s ipv6=on;

    # One counter per client IP for the rate limit.
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;

    proxy_cache_path /var/cache/nginx/proxy levels=1:2 keys_zone=edge_cache:10m max_size=256m inactive=10m use_temp_path=off;

    # These maps keep private and varying responses out of the cache. 1 means skip.
    map $request_method $skip_cache_method {
        default 1;
        GET 0;
        HEAD 0;
    }
    map $http_authorization $skip_cache_auth {
        default 1;
        "" 0;
    }
    map $http_cookie $skip_cache_cookie {
        default 1;
        "" 0;
    }
    map $http_cache_control $skip_cache_request_control {
        default 0;
        ~*no-cache 1;
        ~*no-store 1;
        ~*max-age=0 1;
    }
    map $http_pragma $skip_cache_request_pragma {
        default 0;
        ~*no-cache 1;
    }
    map $upstream_http_set_cookie $skip_cache_set_cookie {
        default 1;
        "" 0;
    }
    map $upstream_http_cache_control $skip_cache_control {
        default 0;
        ~*no-cache 1;
        ~*no-store 1;
        ~*private 1;
    }
    map $upstream_http_vary $skip_cache_vary {
        default 0;
        ~*cookie 1;
        ~*authorization 1;
    }

    # Send Upgrade and Connection only for a real WebSocket request. All other requests keep their connection reuse.
    map $http_upgrade $connection_upgrade {
        default "";
        ~*^websocket$ upgrade;
    }
    map $http_upgrade $websocket_upgrade {
        default "";
        ~*^websocket$ websocket;
    }

    # Take a server out for 10 seconds after 3 failed attempts. A backup server only gets traffic when the others are down.
    upstream backend {
        least_conn;
        server 10.0.0.11:3000 max_fails=3 fail_timeout=10s;
        server 10.0.0.12:3000 max_fails=3 fail_timeout=10s;
        server 10.0.0.13:3000 max_fails=3 fail_timeout=10s backup;
    }

    # Catch-all. Requests for an unknown Host get no answer.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;
    }

    # Reject TLS handshakes for unknown names before any certificate is chosen.
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        # reuseport may appear once per address and port. This is the first QUIC listener.
        listen 443 quic reuseport default_server;
        listen [::]:443 quic reuseport default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name example.com www.example.com;

        location / {
            return 308 https://example.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        listen 443 quic;
        listen [::]:443 quic;
        http2 on;
        server_name example.com;

        acme_certificate letsencrypt;
        ssl_certificate $acme_certificate;
        ssl_certificate_key $acme_certificate_key;
        # Do not parse the certificate on every request.
        ssl_certificate_cache max=2;

        # The NGINX default is 1m. Larger uploads get status 413.
        client_max_body_size 1m;

        # Security headers are set once here. add_header_inherit merge lets locations add theirs.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        # Tell browsers that HTTP/3 is available on the public HTTPS port.
        add_header Alt-Svc 'h3=":443"; ma=86400' always;

        # Requests over the limit get status 429.
        limit_req_status 429;

        # Health check for containers and load balancers. It is not logged and not rate limited.
        location = /healthz {
            access_log off;
            return 204;
        }

        # Dotfiles are private, except .well-known (security.txt, ACME, and similar).
        location ~ /\.(?!well-known/) {
            deny all;
        }

        location / {
            proxy_pass http://backend;
            # proxy_set_header is all or nothing per location, so each proxy location lists the full set.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # This NGINX is the trust boundary, so a client X-Forwarded-For is replaced, not extended.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_set_header X-Request-ID $request_id;
            # Empty values are not sent. This stops clients from faking proxy metadata.
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_set_header X-Url-Scheme "";
            proxy_set_header Front-End-Https "";
            proxy_set_header X-Client-IP "";
            proxy_set_header Client-IP "";
            proxy_set_header Proxy "";
            # Do not pass on what the backend says about its own stack.
            proxy_hide_header X-Powered-By;
            # Give up on an unreachable backend after 5 seconds (the default is 60).
            proxy_connect_timeout 5s;
            # Try the next server on gateway errors too. NGINX never retries POST requests unless told to.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            limit_req zone=per_ip burst=20 nodelay;
            # Public GET and HEAD responses only. The maps above skip anything private.
            proxy_cache edge_cache;
            proxy_cache_key "$forwarded_proto|$host|$request_uri";
            proxy_cache_lock on;
            proxy_cache_revalidate on;
            proxy_cache_valid 200 301 302 10m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_bypass $skip_cache_method $skip_cache_auth $skip_cache_cookie $skip_cache_request_control $skip_cache_request_pragma;
            proxy_no_cache $skip_cache_method $skip_cache_auth $skip_cache_cookie $skip_cache_request_control $skip_cache_request_pragma $skip_cache_set_cookie $skip_cache_control $skip_cache_vary;
        }

        # Only this path is upgraded to WebSocket. It is a plain prefix, so the dotfile rule still wins.
        location /ws/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_set_header X-Url-Scheme "";
            proxy_set_header Front-End-Https "";
            proxy_set_header X-Client-IP "";
            proxy_set_header Client-IP "";
            proxy_set_header Proxy "";
            proxy_hide_header X-Powered-By;
            proxy_connect_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_set_header Upgrade $websocket_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # WebSocket connections stay open for a long time.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            limit_req zone=per_ip burst=20 nodelay;
        }

        # Server-sent events: send each event to the client at once. Only this path gives up buffering.
        location /events/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-Ssl "";
            proxy_set_header X-Url-Scheme "";
            proxy_set_header Front-End-Https "";
            proxy_set_header X-Client-IP "";
            proxy_set_header Client-IP "";
            proxy_set_header Proxy "";
            proxy_hide_header X-Powered-By;
            proxy_connect_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_buffering off;
            proxy_read_timeout 1h;
            limit_req zone=per_ip burst=20 nodelay;
        }
    }

    # www.example.com sends visitors to example.com with a permanent redirect.
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        listen 443 quic;
        listen [::]:443 quic;
        http2 on;
        server_name www.example.com;

        acme_certificate letsencrypt;
        ssl_certificate $acme_certificate;
        ssl_certificate_key $acme_certificate_key;
        # Do not parse the certificate on every request.
        ssl_certificate_cache max=2;

        add_header Strict-Transport-Security "max-age=63072000" always;

        return 301 https://example.com$request_uri;
    }

    # Connection counters for monitoring. Loopback only.
    server {
        listen 127.0.0.1:8081;
        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
            access_log off;
        }
    }
}
