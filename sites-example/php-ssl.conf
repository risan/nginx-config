# Generated for NGINX Open Source 1.30.5. Profile: php. Target: host.
# Test it before you reload: nginx -t -c /etc/nginx/nginx.conf
# This file is standalone. It does not include the repository snippets.

# Workers run as an unprivileged user.
user nginx;
# One worker per CPU core. The NGINX default is a single worker.
worker_processes auto;
pid /run/nginx.pid;
# Every connection needs a file descriptor, and a proxied request needs two.
worker_rlimit_nofile 8192;
# Log warnings and worse. The NGINX default is error.
error_log /var/log/nginx/error.log warn;

events {
    # The NGINX default is 512. Raise the open-files limit together with this value.
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    # Unknown file types download instead of showing as text.
    default_type application/octet-stream;

    # Do not reveal the NGINX version.
    server_tokens off;
    # Redirects without a host name, so published ports and proxies cannot leak an internal port.
    absolute_redirect off;
    # Keep the security headers from the server block when a location adds its own header.
    add_header_inherit merge;

    # Send files from the kernel. tcp_nopush fills packets and needs sendfile.
    sendfile on;
    tcp_nopush on;
    # Drop slow header senders after 15 seconds (the default is 60) and free their sockets at once.
    client_header_timeout 15s;
    reset_timedout_connection on;

    # The log has no query string or Referer, because they can contain secrets. rid is the request ID.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
        '$status $body_bytes_sent "$http_user_agent" '
        'rt=$request_time urt=$upstream_response_time us=$upstream_status rid=$request_id';
    access_log /var/log/nginx/access.log main;

    # The public port that visitors use, which can differ from the listen port.
    map $scheme $forwarded_port {
        default 80;
        https 443;
    }
    map $scheme $forwarded_https {
        default "";
        https on;
    }

    # Intermediate (Mozilla guideline v6.0). The protocols match the NGINX default; they are listed so the policy is visible.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # Reuse TLS sessions across workers and keep them for a day. Ticket keys rotate on their own.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Catch-all. Requests for an unknown Host get no answer.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;
    }

    # Reject TLS handshakes for unknown names before any certificate is chosen.
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name example.com;

        # Answer certbot HTTP-01 challenges here, before any redirect or backend. Let’s Encrypt only follows redirects to ports 80 and 443.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/_letsencrypt;
            try_files $uri =404;
        }

        location / {
            return 308 https://example.com$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name example.com;

        ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

        root /var/www/example.com/public;
        index index.php index.html;
        # Declare UTF-8 for text responses.
        charset utf-8;

        # The NGINX default is 1m. Larger uploads get status 413.
        client_max_body_size 16m;

        # Security headers are set once here. add_header_inherit merge lets locations add theirs.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;

        # Health check for containers and load balancers. It is not logged and not rate limited.
        location = /healthz {
            access_log off;
            return 204;
        }

        # Dotfiles are private, except .well-known (security.txt, ACME, and similar).
        location ~ /\.(?!well-known/) {
            deny all;
        }

        # Backups and config files that deployments often leave behind.
        location ~* \.(?:bak|conf|dist|env|fla|inc|ini|log|psd|sh|sql|sw[op]|ya?ml)(?:~)?$ {
            deny all;
        }

        # Plain prefix, so the dotfile and extension rules above still win. A missing file is a 404, never the app fallback.
        location /build/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location / {
            try_files $uri $uri/ /index.php$is_args$args;
        }

        # Run a script only if the file exists. PATH_INFO is not enabled. $realpath_root keeps symlink deploys atomic.
        location ~* \.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            # The official fastcgi_params list, written out once per name. HTTP_PROXY blocks the httpoxy attack.
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param DOCUMENT_URI $document_uri;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REQUEST_SCHEME $scheme;
            fastcgi_param HTTPS $forwarded_https if_not_empty;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $forwarded_port;
            fastcgi_param SERVER_NAME $server_name;
            fastcgi_param REDIRECT_STATUS 200;
            fastcgi_param HTTP_PROXY "";
            fastcgi_param HTTP_X_REQUEST_ID $request_id;
            fastcgi_hide_header X-Powered-By;
        }
    }
}
