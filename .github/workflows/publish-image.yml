name: Publish container image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check the version source
        run: node scripts/check-nginx-version.mjs
      - name: Run renderer and example drift checks
        run: |
          node --test tests/config.test.mjs
          node scripts/generate-examples.mjs --check
      - name: Install and test the browser app
        run: |
          npm --prefix web ci
          npm --prefix web audit --audit-level=moderate
          npm --prefix web run test:unit
          npm --prefix web run build
          cd web && npx playwright install --with-deps chromium
          npm run test:browser
      - name: Parse every profile in stable NGINX
        run: node scripts/verify-nginx-configs.mjs
      - name: Build the candidate without registry credentials
        run: docker build --pull --tag nginx-config-generator:release-ci --build-arg VCS_REF="$GITHUB_SHA" --build-arg BUILD_VERSION=release-ci .
      - name: Exercise the candidate image
        run: |
          sh scripts/smoke-image.sh nginx-config-generator:release-ci
          node scripts/smoke-proxy.mjs nginx-config-generator:release-ci
          node scripts/smoke-cache.mjs nginx-config-generator:release-ci
          node scripts/smoke-php.mjs nginx-config-generator:release-ci
          node scripts/smoke-tls.mjs nginx-config-generator:release-ci

  publish:
    name: Publish multi-architecture GHCR image
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392
        with:
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Check the version source
        run: node scripts/check-nginx-version.mjs
      - name: Validate release ref
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "invalid release tag: $GITHUB_REF_NAME" >&2
              echo "release tags must be vMAJOR.MINOR.PATCH with no leading zeroes or suffix" >&2
              exit 1
            fi
            git fetch --force origin refs/heads/main:refs/remotes/origin/main
            tagged_sha=$(git rev-parse HEAD)
            main_sha=$(git rev-parse origin/main)
            if [ "$tagged_sha" != "$main_sha" ]; then
              echo "release tag must point at the exact current origin/main commit" >&2
              echo "tag=$tagged_sha main=$main_sha" >&2
              exit 1
            fi
          fi
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish the commit candidate
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            release_tag="${GITHUB_REF_NAME#v}"
          else
            release_tag="manual-${GITHUB_SHA:0:12}"
          fi
          case "$release_tag" in
            ''|*[!0-9A-Za-z.-]*)
              echo "invalid image tag: $release_tag" >&2
              exit 1
              ;;
          esac

          candidate_tag="sha-${GITHUB_SHA:0:12}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=mode=max \
            --sbom=true \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${release_tag}" \
            --tag "${image}:${candidate_tag}" \
            --push .

          # Resolve the pushed multi-architecture index before creating any
          # release aliases. A digest is immutable; tags are traceable names.
          index_file="$(mktemp)"
          trap 'rm -f "$index_file"' EXIT
          docker buildx imagetools inspect --raw "${image}:${candidate_tag}" > "$index_file"
          image_digest="sha256:$(sha256sum "$index_file" | cut -d' ' -f1)"
          echo "candidate=${image}@${image_digest}"
          docker buildx imagetools inspect "${image}@${image_digest}"

          # Docker's classic image store cannot pull two platforms from the
          # same multi-architecture index digest. Pull each child manifest by
          # its own digest, while promoting the original index digest below.
          for platform in linux/amd64 linux/arm64; do
            architecture="${platform#*/}"
            platform_manifests="$(jq -c --arg architecture "$architecture" '[.manifests[]? | select(.platform.os == "linux" and .platform.architecture == $architecture)]' "$index_file")"
            platform_count="$(printf '%s' "$platform_manifests" | jq -r 'length')"
            if [ "$platform_count" -ne 1 ]; then
              echo "expected exactly one ${platform} child manifest, found ${platform_count}" >&2
              exit 1
            fi
            platform_digest="$(printf '%s' "$platform_manifests" | jq -r '.[0].digest')"
            if [[ ! "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "invalid ${platform} child manifest digest: ${platform_digest}" >&2
              exit 1
            fi
            echo "platform=${platform} digest=${platform_digest}"
            docker pull --platform "${platform}" "${image}@${platform_digest}"
            DOCKER_PLATFORM="${platform}" sh scripts/smoke-image.sh "${image}@${platform_digest}"
          done

          # Promote only the verified digest. Stable aliases move only for an
          # exact pushed vX.Y.Z tag; manual runs get traceable SHA-derived tags.
          docker buildx imagetools create --tag "${image}:${release_tag}" "${image}@${image_digest}"
          if [[ "$GITHUB_REF_TYPE" = tag ]]; then
            major="${release_tag%%.*}"
            rest="${release_tag#*.}"
            minor="${rest%%.*}"
            docker buildx imagetools create \
              --tag "${image}:${major}.${minor}" \
              --tag "${image}:${major}" \
              --tag "${image}:latest" \
              "${image}@${image_digest}"
          fi
