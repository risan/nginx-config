name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Config tests and drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Check the single NGINX version source
        run: node scripts/check-nginx-version.mjs
      - name: Run renderer tests
        run: node --test tests/config.test.mjs
      - name: Check generated examples
        run: node scripts/generate-examples.mjs --check

  web:
    name: Vue tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser app dependencies
        run: npm --prefix web ci
      - name: Audit browser app dependencies
        run: npm --prefix web audit --audit-level=moderate
      - name: Run browser app unit tests
        run: npm --prefix web run test:unit
      - name: Build browser app
        run: npm --prefix web run build
      - name: Install Chromium for browser smoke tests
        run: cd web && npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm --prefix web run test:browser

  docker:
    name: NGINX syntax and runtime
    runs-on: ubuntu-latest
    needs: [config, web]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Set up NGINX configuration test image
        run: node scripts/check-nginx-version.mjs
      - name: Parse every generated profile in stable NGINX
        run: node scripts/verify-nginx-configs.mjs
      - name: Build the production image without registry credentials
        run: docker build --pull --tag nginx-config-generator:ci --build-arg VCS_REF="$GITHUB_SHA" --build-arg BUILD_VERSION=ci .
      - name: Exercise the image as an unprivileged read-only service
        run: sh scripts/smoke-image.sh nginx-config-generator:ci
      - name: Exercise proxy forwarding headers
        run: node scripts/smoke-proxy.mjs
      - name: Exercise proxy cache privacy and method guards
        run: node scripts/smoke-cache.mjs
      - name: Exercise PHP-FPM script checks
        run: node scripts/smoke-php.mjs
      - name: Exercise TLS redirect and certificate path
        run: node scripts/smoke-tls.mjs
      - name: Validate Compose definition
        run: |
          docker compose -f compose.yaml config
          docker compose --profile tls -f compose.yaml config
