# Use the distribution's maintained CGI parameter list, then override the
# values that must be tied to this server. Include inside a FastCGI location.
# The generated configs write the whole list out instead, so each name appears once.
include /etc/nginx/fastcgi_params;
# $realpath_root keeps atomic symlink deployments working.
fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
fastcgi_param DOCUMENT_ROOT $realpath_root;

# Do not pass a client-controlled Proxy header to CGI (HTTPoxy protection).
fastcgi_param HTTP_PROXY "";
fastcgi_param HTTP_X_REQUEST_ID $request_id;
fastcgi_hide_header X-Powered-By;
