# Include this inside a normal reverse-proxy location. The edge NGINX is the
# trust boundary, so incoming X-Forwarded-* values are overwritten.
# NGINX 1.29.7+ uses HTTP/1.1 and upstream keepalive by default, so there is no
# proxy_http_version or Connection line here.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
# Behind a TLS-terminating load balancer, $scheme is http. See docs/security.md.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Request-ID $request_id;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Ssl "";
proxy_set_header X-Url-Scheme "";
proxy_set_header Front-End-Https "";
proxy_set_header X-Client-IP "";
proxy_set_header Client-IP "";
proxy_set_header Proxy "";
proxy_hide_header X-Powered-By;
proxy_connect_timeout 5s;
