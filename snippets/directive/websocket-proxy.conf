# Add this map once in http {} before using the location directives below:
# map $http_upgrade $connection_upgrade {
#     default close;
#     ~*^websocket$ upgrade;
#     "" close;
# }
# map $http_upgrade $websocket_upgrade {
#     default "";
#     ~*^websocket$ websocket;
# }

# Include inside a WebSocket location only. Do not use this for every request.
proxy_http_version 1.1;
proxy_set_header Upgrade $websocket_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
proxy_cache_bypass $http_upgrade;
