# Add these maps once in http {} before using the location directives below.
# Normal requests get an empty Connection value, so NGINX does not send the
# header and upstream keepalive keeps working.
# map $http_upgrade $connection_upgrade {
#     default "";
#     ~*^websocket$ upgrade;
# }
# map $http_upgrade $websocket_upgrade {
#     default "";
#     ~*^websocket$ websocket;
# }

# Include inside a WebSocket location only, together with the proxy_set_header
# lines of your normal proxy location (proxy_set_header is all or nothing).
proxy_set_header Upgrade $websocket_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
