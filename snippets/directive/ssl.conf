# Include this at http level so all TLS virtual servers share one resumption
# context. Certificate directives belong in each matching server block.
ssl_protocols TLSv1.2 TLSv1.3;
# TLS 1.3 cipher selection is handled by OpenSSL; this list covers TLS 1.2.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# NGINX 1.23.2+ rotates ticket keys automatically in a shared cache. For
# several NGINX hosts, use a deliberate shared key distribution policy instead.
ssl_session_tickets on;
# 0-RTT requests can be replayed, so keep early data disabled.
ssl_early_data off;

# OCSP stapling needs a verified issuer chain and a resolver reachable from
# this host. Enable it only after those prerequisites are configured locally.
# ssl_trusted_certificate /etc/nginx/tls/issuer-chain.pem;
# resolver 127.0.0.53 valid=300s;
# resolver_timeout 5s;
# ssl_stapling on;
# ssl_stapling_verify on;
