# Include this at http level so all TLS virtual servers share one resumption
# context. Certificate directives belong in each matching server block.
# Mozilla guideline v6.0, intermediate profile.
ssl_protocols TLSv1.2 TLSv1.3;
# TLS 1.3 cipher selection is handled by OpenSSL; this list covers TLS 1.2.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# Session tickets stay on (the default). NGINX 1.23.2+ rotates the keys in a
# shared cache. Early data (0-RTT) stays off (the default) because it can be replayed.

# OCSP stapling does nothing for Let's Encrypt certificates: Let's Encrypt
# turned off its OCSP responders on 2025-08-06. Use it only with a CA that still
# runs OCSP, after you set an issuer chain and a resolver:
# ssl_trusted_certificate /etc/nginx/tls/issuer-chain.pem;
# resolver 127.0.0.53 valid=300s;
# ssl_stapling on;
# ssl_stapling_verify on;
