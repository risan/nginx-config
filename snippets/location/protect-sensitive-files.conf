# Never serve dotfiles or deployment metadata, except .well-known (security.txt,
# ACME challenges, and similar). Keep credentials outside the web root.
location ~ /\.(?!well-known/) {
    deny all;
}

# Backups and config files that deployments often leave behind. Use this only
# when the server serves files. A proxy site would block real routes such as /openapi.yaml.
location ~* \.(?:bak|conf|dist|env|fla|inc|ini|log|psd|sh|sql|sw[op]|ya?ml)(?:~)?$ {
    deny all;
}
