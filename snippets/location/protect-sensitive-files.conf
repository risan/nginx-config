# Permit only the ACME challenge directory under .well-known.
location ^~ /.well-known/acme-challenge/ {
    try_files $uri =404;
}

# Other .well-known files and dotfiles are not public by default.
location ~* /\.well-known(?:/|$) {
    deny all;
}

# Never serve dotfiles or deployment metadata. Keep credentials outside web root.
location ~* /\.(?!well-known(?:/|$)) {
    deny all;
}

location ~* \.(?:bak|conf|dist|env|fla|inc|ini|log|psd|sh|sql|sw[op]|ya?ml)(?:~)?$ {
    deny all;
}
