# HTML changes with deployments, so ask browsers to revalidate it.
location ~* \.html$ {
    # Keep server-level security headers when this location adds caching.
    add_header_inherit merge;
    add_header Cache-Control "no-cache" always;
}

# Long-lived caching is safe only for folders whose file names contain a content
# hash, such as /assets/index-BdK3x9aF.js. Copy this block once per such folder.
# It is a plain prefix on purpose: the dotfile and extension rules still win.
location /assets/ {
    # Keep server-level security headers when this location adds caching.
    add_header_inherit merge;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}
