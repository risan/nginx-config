# HTML changes with deployments, so ask browsers to revalidate it.
location ~* \.html$ {
    # Keep server-level security headers when this location adds caching.
    add_header_inherit merge;
    add_header Cache-Control "no-cache" always;
}

# Long-lived caching is safe only for filenames containing a content hash.
# Adapt the extension list to the files your build actually fingerprints.
location ~* "\.[A-Za-z0-9_-]{8,}\.(?:avif|css|eot|gif|ico|jpe?g|js|mjs|png|svg|ttf|woff2?|webp|webm)$" {
    # Keep server-level security headers when this location adds caching.
    add_header_inherit merge;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}
