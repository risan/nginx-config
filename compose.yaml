name: nginx-config

services:
  nginx:
    build:
      context: .
      args:
        # Keep this equal to lib/version.ts. CI checks the two values.
        NGINX_VERSION: "1.30.5"
        BUILD_VERSION: "local"
        VCS_REF: "local"
    image: nginx-config:local
    ports:
      - "${NGINX_CONFIG_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # The image includes a small static welcome site. For a generated profile,
    # mount the complete renderer output and your application content instead.
    # Use a config made for the "Container" target (ports 8080 and 8443, logs to
    # stdout), such as sites-example/container.conf or one from the web builder:
    #
    #   NGINX_CONFIG=./sites-example/container.conf \
    #   NGINX_CONTENT=./public \
    #   NGINX_SERVER_NAME=example.com \
    #   docker compose up --build
    #
    # Both mounts are read-only and replace the image defaults at these paths.
    volumes:
      - "${NGINX_CONFIG:-./docker/nginx.conf}:/etc/nginx/nginx.conf:ro"
      - "${NGINX_CONTENT:-./docker/default}:/usr/share/nginx/html:ro"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--header=Host:${NGINX_SERVER_NAME:-localhost}", "--output-document=/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Optional TLS mode. Create the two files first, then run:
  #
  #   NGINX_TLS_CONFIG=./path/to/nginx.conf \
  #   NGINX_TLS_CERTS=./path/to/certs \
  #   docker compose --profile tls up nginx-tls
  #
  # The mounted configuration must be a "Container" target config with HTTPS
  # set to your own certificate files (it listens on 8443). Its certificate
  # paths must be under /etc/nginx/tls, for example sites-example/container.conf.
  # Set NGINX_TLS_SERVER_NAME to the same name as the mounted config's
  # server_name so the local health check sends the right TLS SNI. The certificate directory and files must be readable by UID 101.
  # The default NGINX runtime remains HTTP-only.
  nginx-tls:
    profiles: [tls]
    build:
      context: .
      args:
        NGINX_VERSION: "1.30.5"
        BUILD_VERSION: "local-tls"
        VCS_REF: "local"
    image: nginx-config:local
    environment:
      NGINX_TLS_SERVER_NAME: "${NGINX_TLS_SERVER_NAME:-example.com}"
    ports:
      - "${NGINX_CONFIG_TLS_PORT:-8443}:8443"
    volumes:
      - "${NGINX_TLS_CONFIG:-./nginx.tls.conf}:/etc/nginx/nginx.conf:ro"
      - "${NGINX_TLS_CERTS:-./ssl}:/etc/nginx/tls:ro"
      - "${NGINX_CONTENT:-./docker/default}:/usr/share/nginx/html:ro"
    healthcheck:
      # This is a local probe for the mounted TLS config. It skips validation
      # because a local self-signed certificate is common for this example.
      test:
        - CMD-SHELL
        - >-
          curl --silent --show-error --fail --insecure --output /dev/null
          --header "Host: $${NGINX_TLS_SERVER_NAME}"
          --resolve "$${NGINX_TLS_SERVER_NAME}:8443:127.0.0.1"
          "https://$${NGINX_TLS_SERVER_NAME}:8443/healthz"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
